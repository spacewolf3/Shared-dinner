<title>Open Door</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column with a floating bottom tab bar */
:root {
  --bg: #f2f0fa;
  --surface: #ffffff;
  --surface-2: #f6f4fc;
  --ink: #1d1a36;
  --muted: #6a6688;
  --line: #e3dff2;
  --glow: #ffc531;
  --glow-soft: rgba(255, 190, 40, .30);
  --note: #fff6d3;
  --pop: #d93a7a;
  --pop-ink: #ffffff;
  --mine-ring: rgba(217, 58, 122, .12);
  --open: #12865a;
  --open-bg: #daf3e7;
  --text: #2f66d0;
  --text-bg: #e1ebff;
  --off: #8d89a6;
  --off-bg: #ebe9f3;
  --danger: #c0392b;
  --shadow: 0 1px 2px rgba(29, 26, 54, .06), 0 8px 24px rgba(29, 26, 54, .07);
  --sun1: #ffd84d; --sun2: #ffeaa0;
  --mint1: #86dcbb; --mint2: #c9f2e1;
  --berry1: #ff8fb8; --berry2: #ffcade;
  --sky1: #8ec5ff; --sky2: #d2e7ff;
  --lilac1: #b9a6ff; --lilac2: #e0d7ff;
  --peach1: #ffb48a; --peach2: #ffdcc7;
  --nav-h: 64px;
  --f-display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-hand: 'Caveat', 'Bradley Hand', 'Comic Sans MS', cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14122a; --surface: #1f1c3b; --surface-2: #19173a; --ink: #f1efff; --muted: #a7a3c8; --line: #34305a;
    --glow: #ffcf4d; --glow-soft: rgba(255, 207, 77, .20); --note: #2c2846;
    --pop: #ff6ba5; --pop-ink: #22081a; --mine-ring: rgba(255, 107, 165, .16);
    --open: #4fd69b; --open-bg: rgba(79, 214, 155, .14); --text: #86b4ff; --text-bg: rgba(134, 180, 255, .16);
    --off: #8f8bb0; --off-bg: rgba(143, 139, 176, .16); --danger: #ff8a7a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);
    --sun1: #8f6d00; --sun2: #6e5400; --mint1: #1f7a5d; --mint2: #175c46; --berry1: #94305e; --berry2: #722448;
    --sky1: #275a9a; --sky2: #1d4475; --lilac1: #5242a6; --lilac2: #3e3180; --peach1: #96512b; --peach2: #733d20;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14122a; --surface: #1f1c3b; --surface-2: #19173a; --ink: #f1efff; --muted: #a7a3c8; --line: #34305a;
  --glow: #ffcf4d; --glow-soft: rgba(255, 207, 77, .20); --note: #2c2846;
  --pop: #ff6ba5; --pop-ink: #22081a; --mine-ring: rgba(255, 107, 165, .16);
  --open: #4fd69b; --open-bg: rgba(79, 214, 155, .14); --text: #86b4ff; --text-bg: rgba(134, 180, 255, .16);
  --off: #8f8bb0; --off-bg: rgba(143, 139, 176, .16); --danger: #ff8a7a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);
  --sun1: #8f6d00; --sun2: #6e5400; --mint1: #1f7a5d; --mint2: #175c46; --berry1: #94305e; --berry2: #722448;
  --sky1: #275a9a; --sky2: #1d4475; --lilac1: #5242a6; --lilac2: #3e3180; --peach1: #96512b; --peach2: #733d20;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--f-body); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pop); outline-offset: 2px; }
.tabular { font-variant-numeric: tabular-nums; }

.app {
  max-width: 480px; margin: 0 auto;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; min-height: 100vh; min-height: 100dvh;
}
#view { flex: 1; display: grid; gap: 20px; align-content: start; padding-bottom: 16px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font: 800 26px/1 var(--f-display); letter-spacing: -.02em; margin: 0; }
.brand .lamp { width: 16px; height: 16px; }
.who { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.who select { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 10px; font-weight: 600; color: var(--ink); max-width: 190px; }

/* Bottom tab bar */
.nav { position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); z-index: 6; height: var(--nav-h); margin-bottom: 10px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); }
.nav button { position: relative; display: grid; place-items: center; align-content: center; gap: 1px; border: 0; background: transparent; border-radius: 18px; color: var(--muted); font-weight: 600; font-size: 12px; }
.nav button .ico { font-size: 20px; line-height: 1; }
.nav button[aria-selected="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.count { position: absolute; top: 4px; left: calc(50% + 6px); display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--glow); color: #2a2000; font-size: 11px; font-weight: 700; }

/* Lamps: glowing yellow = come on by, half-filled blue = text first, grey = closed */
.lamp { display: inline-block; flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--off); }
.lamp.open { background: var(--glow); box-shadow: 0 0 0 4px var(--glow-soft), 0 0 16px 5px var(--glow-soft); animation: glow 3.2s ease-in-out infinite; }
.lamp.text { background: linear-gradient(90deg, var(--text) 50%, var(--surface) 50%); box-shadow: inset 0 0 0 2px var(--text), 0 0 0 3px var(--text-bg); }
@keyframes glow { 50% { box-shadow: 0 0 0 5px var(--glow-soft), 0 0 26px 9px var(--glow-soft); } }
@media (prefers-reduced-motion: reduce) { .lamp.open { animation: none; } .toast { animation: none !important; } }

/* Board */
.hello { display: grid; gap: 4px; }
.hello h2 { margin: 0; font: 800 34px/1.02 var(--f-display); letter-spacing: -.025em; text-wrap: balance; }
.hello p { margin: 0; color: var(--muted); }
.list { display: grid; gap: 14px; }
.group-label { margin: 6px 0 -4px; font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.calm { display: grid; gap: 10px; justify-items: start; padding: 18px; border-radius: 22px; background: var(--surface-2); border: 1px dashed var(--line); }
.calm strong { font: 700 18px/1.2 var(--f-display); }
.calm span { color: var(--muted); font-size: 14px; }

/* Card with a themed "doormat" cover */
.card { position: relative; overflow: hidden; display: grid; gap: 12px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); min-width: 0; }
.card.closed { background: var(--surface-2); box-shadow: none; }
.card.mine { border: 2px solid var(--pop); box-shadow: 0 0 0 5px var(--mine-ring), var(--shadow); }
.cover { height: 58px; margin: -16px -16px 0; }
.card.closed .cover { filter: grayscale(.85); opacity: .45; }
.pat-stripes .cover, .pat-stripes.swatch-pat { background: repeating-linear-gradient(135deg, var(--c1) 0 12px, var(--c2) 12px 24px); }
.pat-dots .cover, .pat-dots.swatch-pat { background: radial-gradient(circle, var(--c1) 3.5px, transparent 4.5px) 0 0 / 16px 16px, var(--c2); }
.pat-checks .cover, .pat-checks.swatch-pat { background: conic-gradient(var(--c1) 25%, var(--c2) 0 50%, var(--c1) 0 75%, var(--c2) 0) 0 0 / 24px 24px; }
.pat-scallops .cover, .pat-scallops.swatch-pat { background: radial-gradient(circle at 50% 0, var(--c1) 8px, transparent 9px) 0 0 / 20px 12px, var(--c2); }
.pat-plain .cover, .pat-plain.swatch-pat { background: var(--c1); }
.av { position: relative; flex: none; width: 52px; height: 52px; border-radius: 17px; display: grid; place-items: center; font-size: 26px; background: var(--surface); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.card > .av { position: absolute; top: 30px; left: 16px; }
.card.closed > .av { background: var(--surface-2); border-color: var(--surface-2); }
.av .lamp { position: absolute; right: -5px; bottom: -5px; border: 2px solid var(--surface); width: 17px; height: 17px; }
.names { min-width: 0; padding-left: 64px; padding-right: 4px; }
.names h3 { margin: 0; font: 700 19px/1.15 var(--f-display); letter-spacing: -.01em; overflow-wrap: anywhere; }
.names p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.you-tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--pop); color: var(--pop-ink); font: 700 11px/1.6 var(--f-body); letter-spacing: .04em; vertical-align: 3px; }
.bell { position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; padding: 0; border-radius: 50%; font-size: 17px; border: 0; background: var(--surface); box-shadow: var(--shadow); }
.bell[aria-pressed="true"] { background: var(--glow); }

.status-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: 13px; }
.pill.open { color: var(--open); background: var(--open-bg); }
.pill.text { color: var(--text); background: var(--text-bg); }
.pill.closed { color: var(--off); background: var(--off-bg); }
.note { margin: 0; padding: 10px 14px 12px; background: var(--note); border-radius: 4px 16px 16px 16px; font: 600 23px/1.12 var(--f-hand); transform: rotate(-.5deg); overflow-wrap: anywhere; }
.where { margin: 0; font-size: 13px; font-weight: 600; }
.coming { margin: 0; font-size: 14px; font-weight: 600; color: var(--open); }
.text-hint { margin: 0; font-size: 14px; font-weight: 600; color: var(--text); }

.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 16px; font-weight: 600; font-size: 15px; }
.btn:hover { border-color: var(--muted); }
.btn.pop { background: var(--pop); color: var(--pop-ink); border-color: transparent; }
.btn.pop:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.danger { color: var(--danger); }
.btn.danger-solid { background: var(--danger); color: var(--surface); border-color: transparent; }
.btn.block { width: 100%; padding-block: 14px; font-size: 16px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.headed { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 10px 14px; border-radius: 16px; background: var(--open-bg); color: var(--open); font-weight: 600; font-size: 14px; }

/* Your own door controls */
.my-controls { display: grid; gap: 10px; }
.until-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 600; }
.until-row select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 9px 12px; font-weight: 600; font-size: 15px; color: var(--ink); }

/* Forms and settings */
.sec { display: grid; gap: 10px; }
.sec > h2 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 11px 13px; font-size: 16px; }
textarea.input { resize: vertical; min-height: 78px; font: 600 22px/1.15 var(--f-hand); }
.counter { justify-self: end; font-size: 12px; color: var(--muted); }
.error { margin: 0; font-size: 13px; font-weight: 600; color: var(--danger); }
.panel-card { display: grid; gap: 14px; padding: 16px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); }
.settings { border-radius: 20px; border: 1.5px dashed var(--line); }
.settings > summary { padding: 14px 16px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.settings-body { display: grid; gap: 14px; padding: 0 12px 12px; }
.emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.emoji-grid button { aspect-ratio: 1; max-width: 100%; padding: 0; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 20px; }
.emoji-grid button[aria-pressed="true"] { background: var(--glow-soft); border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 40px; height: 40px; padding: 0; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); background: var(--c1); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }
.pat-btn { display: grid; gap: 6px; justify-items: center; padding: 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); font-size: 12px; font-weight: 600; }
.pat-btn[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.swatch-pat { display: block; width: 56px; height: 28px; border-radius: 8px; }
.hrow { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface-2); }
.hrow-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.days { display: flex; gap: 6px; flex-wrap: wrap; }
.day { width: 36px; height: 36px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 13px; }
.day[aria-pressed="true"] { background: var(--glow); color: #2a2000; border-color: transparent; }
.times { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.times input { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 9px; }
.empty { margin: 0; padding: 14px; border-radius: 16px; background: var(--surface-2); color: var(--muted); font-size: 14px; }

/* Welcome */
.welcome { display: grid; gap: 14px; padding-top: 8px; }
.welcome h2 { margin: 0; font: 800 40px/1 var(--f-display); letter-spacing: -.03em; text-wrap: balance; }
.welcome p { margin: 0; font-size: 17px; color: var(--muted); max-width: 34ch; }
.loading { display: grid; gap: 8px; justify-items: center; padding: 60px 0; color: var(--muted); text-align: center; }
.loading .lamp { width: 22px; height: 22px; }

.toasts { position: fixed; left: 0; right: 0; top: 0; z-index: 20; display: grid; justify-items: center; gap: 8px; pointer-events: none;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast { max-width: 440px; padding: 12px 16px; border-radius: 16px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px; box-shadow: var(--shadow); animation: down .25s ease-out; }
@keyframes down { from { transform: translateY(-10px); opacity: 0; } }
</style>

<main class="app">
  <header class="top">
    <h1 class="brand"><span class="lamp open" aria-hidden="true"></span>Open Door</h1>
    <div class="who" id="who" hidden><label for="whoami">You're</label><select id="whoami"></select></div>
  </header>
  <section id="view"><div class="loading"><span class="lamp open" aria-hidden="true"></span><span>Opening the door…</span></div></section>
  <nav class="nav" role="tablist" id="tabs" aria-label="Sections" hidden></nav>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
  const MIN = 60e3, HOUR = 60 * MIN;
  const DEFAULT_OPEN = 3 * HOUR;   // one tap opens your door for this long
  const COMING_FOR = 2 * HOUR;     // "I'm coming" quietly disappears after this
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const DAY_INITIAL = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  const STATES = {
    open:   { label: 'Come on by' },
    text:   { label: 'Text first' },
    closed: { label: 'Door closed' },
  };
  const COLORS = [
    { k: 'sun', name: 'Sunflower' }, { k: 'mint', name: 'Mint' }, { k: 'berry', name: 'Berry' },
    { k: 'sky', name: 'Sky' }, { k: 'lilac', name: 'Lilac' }, { k: 'peach', name: 'Peach' },
  ];
  const PATTERNS = [
    { k: 'stripes', name: 'Stripes' }, { k: 'dots', name: 'Dots' }, { k: 'checks', name: 'Checks' },
    { k: 'scallops', name: 'Scallops' }, { k: 'plain', name: 'Plain' },
  ];
  const EMOJIS = ['🏡', '🏠', '🌻', '🪴', '🐈', '🐕', '🛝', '🎸', '🌮', '☕', '🍦', '🚲', '🏕️', '🌈', '🍋', '🧺'];
  const IDEAS = [
    "👶 Open for newborn visits! Come say hi",
    "🍦 We made ice cream. Come get a scoop!",
    "☕ Coffee's on",
    "🔥 Fire pit is going tonight",
    "🛝 Kids are playing out front",
    "🍅 Too many tomatoes. Take some!",
  ];

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = s => document.querySelector(s);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const now = () => Date.now();
  const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const clone = o => JSON.parse(JSON.stringify(o));
  function atDay(t, dayOffset, mins) {
    const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + dayOffset);
    return d.getTime() + mins * MIN;
  }
  const mins = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };

  // ---- Storage: the page's shared database when it has one, this browser otherwise ----
  const LS_DATA = 'od-data-v1', LS_ME = 'od-current-house';
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  let db = null, houses = {}, visits = {}, loaded = false, slowNote = '';

  function saveLocal() { if (!db) lsSet(LS_DATA, JSON.stringify({ houses, visits })); }
  function loadLocal() {
    try { const d = JSON.parse(lsGet(LS_DATA) || '{}'); houses = d.houses || {}; visits = d.visits || {}; } catch (e) { houses = {}; visits = {}; }
    loaded = true;
    onData(true);
  }
  // One write at a time per document, in order
  const queues = {};
  function queueWrite(key, fn) {
    queues[key] = (queues[key] || Promise.resolve()).then(fn).catch(err => {
      toast(err && err.code === 'quota_exceeded' ? 'Storage is full, so that change was not saved.' : "Couldn't save that change. Check your connection and try again.");
    });
  }
  function putHouse(h) {
    houses[h.id] = h;
    if (db) { const body = clone(h); queueWrite('h:' + h.id, () => db.collection('houses').doc(h.id).set(body)); } else saveLocal();
  }
  function dropHouse(id) {
    delete houses[id];
    for (const v of Object.values(visits)) if (v.host === id || v.guest === id) dropVisit(v.id);
    if (db) queueWrite('h:' + id, () => db.collection('houses').doc(id).delete()); else saveLocal();
  }
  function putVisit(v) {
    visits[v.id] = v;
    if (db) { const body = clone(v); queueWrite('v:' + v.id, () => db.collection('visits').doc(v.id).set(body)); } else saveLocal();
  }
  function dropVisit(id) {
    delete visits[id];
    if (db) queueWrite('v:' + id, () => db.collection('visits').doc(id).delete()); else saveLocal();
  }
  // Debounced save for typing
  const timers = {};
  function saveSoon(h) { clearTimeout(timers[h.id]); timers[h.id] = setTimeout(() => putHouse(h), 600); }

  async function connect() {
    if (!window.claude || typeof window.claude.use !== 'function') { loadLocal(); return; }
    let d = null;
    try { d = await window.claude.use('db'); } catch (e) { d = null; }
    if (!d) { loadLocal(); return; }
    db = d;
    const slow = setTimeout(() => { slowNote = loaded ? 'Showing saved houses. Updates may be out of date.' : "Can't reach your houses yet. Check your connection."; render(); }, 10000);
    let gotHouses = false, gotVisits = false;
    const ready = () => { if (gotHouses && gotVisits && !loaded) { loaded = true; onData(true); } else if (loaded) onData(false); };
    const fail = () => { clearTimeout(slow); slowNote = "Can't reach your houses right now. Reload the page to try again."; loaded = true; render(); };
    db.collection('houses').onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(doc => { next[doc.id] = { ...clone(doc.data()), id: doc.id }; });
      houses = next; gotHouses = true;
      if (!snap.metadata.fromCache) { clearTimeout(slow); slowNote = ''; }
      ready();
    }, fail);
    db.collection('visits').onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(doc => { next[doc.id] = { ...clone(doc.data()), id: doc.id }; });
      visits = next; gotVisits = true;
      ready();
    }, fail);
  }

  // ---- State on this device ----
  let currentId = lsGet(LS_ME);
  let tab = 'board', settingsOpen = false, confirmDelete = false;
  let form = null; // the "new house" form while it's open
  const me = () => houses[currentId] || null;
  const byId = id => houses[id];
  const nameOf = id => (byId(id) || {}).name || 'A friend';
  const isPlural = name => name.includes('&') || name.includes(' and ') || name.startsWith('The ');
  const verb = (name, one, many) => isPlural(name) ? many : one;
  const sortedHouses = () => Object.values(houses).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  function setCurrent(id) { currentId = id; lsSet(LS_ME, id || ''); }
  function ensureCurrent() {
    if (!me()) { const first = sortedHouses()[0]; setCurrent(first ? first.id : null); }
  }

  // ---- Status logic ----
  function activeWindow(h, t) {
    const day = new Date(t).getDay();
    for (const w of h.hours || []) {
      if (!w.days.includes(day)) continue;
      const s = atDay(t, 0, mins(w.start)), e = atDay(t, 0, mins(w.end));
      if (s <= t && t < e) return { start: s, end: e };
    }
    return null;
  }
  function nextWindow(h, t) {
    let best = null;
    const day = new Date(t).getDay();
    for (let off = 0; off <= 7; off++) {
      for (const w of h.hours || []) {
        if (!w.days.includes((day + off) % 7)) continue;
        const s = atDay(t, off, mins(w.start));
        if (s > t && (best === null || s < best)) best = s;
      }
    }
    return best;
  }
  function effective(h, t = now()) {
    if (h.manual && h.manual.until > t) return { state: h.manual.state, until: h.manual.until, source: 'manual' };
    const w = activeWindow(h, t);
    if (w) return { state: 'open', until: w.end, source: 'hours' };
    return { state: 'closed', source: 'none', next: nextWindow(h, t) };
  }
  const coming = (h, t = now()) => Object.values(visits).filter(v => v.host === h.id && byId(v.guest) && t < v.at + COMING_FOR).sort((a, b) => a.at - b.at);

  const roundUp30 = t => Math.ceil(t / (30 * MIN)) * 30 * MIN;
  function openDoor(h) { h.manual = { state: 'open', since: now(), until: roundUp30(now() + DEFAULT_OPEN) }; putHouse(h); }
  function closeDoor(h) {
    // During regular open hours, closing keeps the door shut until those hours end
    const w = activeWindow(h, now());
    h.manual = w ? { state: 'closed', since: now(), until: w.end } : null;
    putHouse(h);
    for (const v of coming(h)) dropVisit(v.id);
  }

  // ---- Formatting ----
  const fmtTime = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  function fmtWhen(t) {
    const d = new Date(t), n = new Date(now());
    if (d.toDateString() === n.toDateString()) return fmtTime(t);
    const tm = new Date(n); tm.setDate(tm.getDate() + 1);
    if (d.toDateString() === tm.toDateString()) return 'tomorrow ' + fmtTime(t);
    return DAYS[d.getDay()] + ' ' + fmtTime(t);
  }
  function fmtClock(s) {
    let [h, m] = s.split(':').map(Number);
    const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    return { txt: m ? `${h}:${String(m).padStart(2, '0')}` : String(h), ap };
  }
  function fmtRange(a, b) {
    const x = fmtClock(a), y = fmtClock(b);
    return x.ap === y.ap ? `${x.txt}–${y.txt} ${y.ap}` : `${x.txt} ${x.ap}–${y.txt} ${y.ap}`;
  }
  function fmtDays(days) {
    const s = [...days].sort((a, b) => a - b);
    if (!s.length) return 'No days picked';
    if (s.length === 7) return 'Every day';
    if (s.join() === '1,2,3,4,5') return 'Weekdays';
    if (s.join() === '0,6') return 'Weekends';
    const runs = []; let st = s[0], pr = s[0];
    for (let i = 1; i <= s.length; i++) {
      if (s[i] === pr + 1) { pr = s[i]; continue; }
      runs.push(st === pr ? DAYS[st] : pr - st === 1 ? `${DAYS[st]}, ${DAYS[pr]}` : `${DAYS[st]}–${DAYS[pr]}`);
      st = pr = s[i];
    }
    return runs.join(', ');
  }
  const joinNames = list => list.length <= 1 ? list.join('') : list.slice(0, -1).join(', ') + ' & ' + list[list.length - 1];
  const themeStyle = h => `--c1: var(--${h.color}1); --c2: var(--${h.color}2);`;

  // ---- Toasts and live updates ----
  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), 4200);
  }
  let prevStates = {}, seenVisits = new Set();
  function liveCheck(baseline) {
    const t = now(), m = me();
    const cur = Object.fromEntries(Object.values(houses).map(h => [h.id, effective(h, t).state]));
    if (!baseline && m) {
      for (const h of Object.values(houses)) {
        if (h.id === m.id || !(m.watching || []).includes(h.id)) continue;
        if (prevStates[h.id] === 'closed' && cur[h.id] !== 'closed') toast(`🔔 ${h.name} just opened ${verb(h.name, 'the', 'their')} door`);
      }
      for (const v of coming(m, t)) {
        if (!seenVisits.has(v.id + v.at)) toast(`👋 ${nameOf(v.guest)} ${verb(nameOf(v.guest), 'is', 'are')} coming over`);
      }
    }
    prevStates = cur;
    seenVisits = new Set(Object.values(visits).map(v => v.id + v.at));
  }
  function onData(baseline) {
    ensureCurrent();
    liveCheck(baseline);
    scheduleRender();
  }
  // Re-render, but never while someone is typing
  let pending = false;
  function scheduleRender() {
    const a = document.activeElement;
    if (a && a.matches('input, textarea, select')) { pending = true; refreshMyCard(); return; }
    render();
  }
  document.addEventListener('focusout', () => setTimeout(() => { if (pending) { pending = false; scheduleRender(); } }, 0));

  // ---- A household card ----
  function cardHTML(h, { preview = false } = {}) {
    const t = now(), e = effective(h, t), isMe = !preview && h.id === currentId;
    let timing;
    if (e.state !== 'closed') timing = `until ${fmtWhen(e.until)}${e.source === 'hours' ? ' · regular hours' : ''}`;
    else if (e.source === 'manual') timing = `until ${fmtWhen(e.until)}`;
    else timing = e.next ? `opens ${fmtWhen(e.next)}` : '';
    const note = e.source === 'manual' ? h.note : e.source === 'hours' ? h.hoursNote : '';
    const guests = preview || e.state === 'closed' ? [] : coming(h, t);
    const meComing = guests.some(v => v.guest === currentId);
    const watching = me() && (me().watching || []).includes(h.id);

    let actions = '';
    if (preview) actions = '';
    else if (isMe) actions = myControlsHTML(h);
    else if (e.state === 'open') {
      actions = meComing
        ? `<div class="headed"><span>👋 You're coming</span><button class="btn ghost" data-act="uncome" data-id="${h.id}">Cancel</button></div>`
        : `<div class="actions"><button class="btn pop" data-act="come" data-id="${h.id}">I'm coming 👋</button></div>`;
    } else if (e.state === 'text') {
      actions = `<p class="text-hint">💬 They're home. Send them a text first.</p>`;
    }

    const bell = !preview && !isMe && me()
      ? `<button class="bell" data-act="bell" data-id="${h.id}" aria-pressed="${!!watching}" aria-label="${watching ? 'Stop telling me when' : 'Tell me when'} ${esc(h.name)} ${verb(h.name, 'opens', 'open')} up" title="${watching ? 'You get a ping when they open up' : 'Get a ping when they open up'}">${watching ? '🔔' : '🔕'}</button>`
      : '';

    return `<article class="card ${e.state} pat-${h.pattern}${isMe ? ' mine' : ''}" style="${themeStyle(h)}">
      <div class="cover"></div>
      ${bell}
      <div class="av" aria-hidden="true">${esc(h.emoji)}<span class="lamp ${e.state}"></span></div>
      <div class="names"><h3>${esc(h.name || 'Your house')}${isMe ? '<span class="you-tag">YOU</span>' : ''}</h3>${h.members ? `<p>${esc(h.members)}</p>` : ''}</div>
      <div class="status-row"><span class="pill ${e.state}">${STATES[e.state].label}</span>${timing ? `<span class="tabular">${esc(timing)}</span>` : ''}</div>
      ${note ? `<p class="note">${esc(note)}</p>` : ''}
      ${!isMe && e.state !== 'closed' && h.where ? `<p class="where">📍 ${esc(h.where)}</p>` : ''}
      ${guests.some(v => v.guest !== currentId) ? `<p class="coming">👋 Coming: ${esc(joinNames(guests.filter(v => v.guest !== currentId).map(v => nameOf(v.guest))))}</p>` : ''}
      ${actions}
    </article>`;
  }

  function endOptions(cur) {
    const t = now(), opts = [];
    const lastToday = atDay(t, 0, 23 * 60 + 30);
    for (let x = roundUp30(t + 30 * MIN); x <= lastToday; x += 30 * MIN) opts.push(x);
    const day = new Date(t).getDay();
    if (day === 5 || day === 6) opts.push(atDay(t, 7 - day, 20 * 60)); // Friday or Saturday: offer all weekend
    if (cur && !opts.includes(cur)) { opts.push(cur); opts.sort((a, b) => a - b); }
    return opts;
  }
  function myControlsHTML(h) {
    const t = now(), e = effective(h, t);
    if (e.source === 'manual' && e.state !== 'closed') {
      return `<div class="my-controls">
        <div class="until-row"><label for="endSel">Open until</label>
          <select id="endSel">${endOptions(e.until).map(x => `<option value="${x}" ${x === e.until ? 'selected' : ''}>${esc(fmtWhen(x))}</option>`).join('')}</select></div>
        <div class="actions">
          <button class="chip" data-act="textfirst" aria-pressed="${e.state === 'text'}">💬 Ask friends to text first</button>
          <button class="btn" data-act="close">Close my door</button>
        </div>
      </div>`;
    }
    const hint = e.source === 'hours'
      ? `You're open now because of your regular open hours, until ${fmtWhen(e.until)}.`
      : `Opens for 3 hours, until ${fmtTime(roundUp30(t + DEFAULT_OPEN))}. You can change the time after.`;
    return `<div class="my-controls">
      <button class="btn pop block" data-act="open">🚪 Open my door</button>
      <p class="hint">${hint}</p>
      ${e.source === 'hours' ? `<button class="btn ghost" data-act="close">Close for now</button>` : ''}
    </div>`;
  }

  // ---- Views ----
  const RANK = { open: 0, text: 1, closed: 2 };
  function renderBoard() {
    const t = now(), m = me();
    const others = sortedHouses().filter(h => h.id !== currentId)
      .map(h => ({ h, e: effective(h, t) }))
      .sort((a, b) => RANK[a.e.state] - RANK[b.e.state] || (a.e.until || a.e.next || Infinity) - (b.e.until || b.e.next || Infinity));
    const lit = others.filter(x => x.e.state === 'open').length;
    const textFirst = others.filter(x => x.e.state === 'text').length;
    const awake = others.filter(x => x.e.state !== 'closed');
    const asleep = others.filter(x => x.e.state === 'closed');
    const headline = !others.length ? 'Welcome home' : lit === 0 ? (textFirst ? 'Quiet, but friends are home' : 'All quiet right now') : lit === 1 ? '1 door is open' : `${lit} doors are open`;
    const day = new Date(t).toLocaleDateString([], { weekday: 'long' });
    const hr = new Date(t).getHours();
    const part = hr < 12 ? 'morning' : hr < 17 ? 'afternoon' : 'evening';
    const upcoming = asleep.map(x => ({ h: x.h, at: x.e.source === 'manual' ? nextWindow(x.h, x.e.until) : x.e.next })).filter(x => x.at).sort((a, b) => a.at - b.at)[0];
    return `
      <div class="hello">
        <h2>${headline}</h2>
        <p>${day} ${part}${textFirst ? ` · ${textFirst} more ${textFirst === 1 ? 'is' : 'are'} home if you text first` : ''}</p>
      </div>
      ${slowNote ? `<p class="empty">${esc(slowNote)}</p>` : ''}
      <div class="list">
        <p class="group-label">Your house</p>
        ${cardHTML(m)}
        ${!others.length ? `<div class="calm"><strong>It's just you so far</strong><span>Add the households you'd love to have stop by. You can switch between houses from the top of the page.</span><button class="btn pop" data-act="new">+ Add a house</button></div>` : ''}
        ${awake.length ? `<p class="group-label">Open now</p>${awake.map(x => cardHTML(x.h)).join('')}` : ''}
        ${others.length && !awake.length ? `<div class="calm"><strong>Everyone's taking it easy 🌙</strong><span>${upcoming ? `Next up: ${esc(upcoming.h.name)} ${verb(upcoming.h.name, 'opens', 'open')} ${fmtWhen(upcoming.at)}.` : 'No open hours coming up.'} Or open your own door and see who drops by.</span></div>` : ''}
        ${asleep.length ? `<p class="group-label">Doors closed</p>${asleep.map(x => cardHTML(x.h)).join('')}` : ''}
        ${others.length ? `<button class="btn" data-act="new">+ Add a house</button>` : ''}
      </div>`;
  }

  function styleFields(h, prefix) {
    return `
      <div class="sec">
        <h2>Picture</h2>
        <div class="emoji-grid">${EMOJIS.map(x => `<button data-act="${prefix}-emoji" data-k="${x}" aria-pressed="${h.emoji === x}" aria-label="${x}">${x}</button>`).join('')}</div>
      </div>
      <div class="sec">
        <h2>Card color</h2>
        <div class="swatches">${COLORS.map(c => `<button class="swatch" style="--c1: var(--${c.k}1)" data-act="${prefix}-color" data-k="${c.k}" aria-pressed="${h.color === c.k}" aria-label="${c.name}" title="${c.name}"></button>`).join('')}</div>
        <div class="chips">${PATTERNS.map(p => `<button class="pat-btn" data-act="${prefix}-pattern" data-k="${p.k}" aria-pressed="${h.pattern === p.k}"><span class="swatch-pat pat-${p.k}" style="${themeStyle(h)}"></span>${p.name}</button>`).join('')}</div>
      </div>`;
  }

  function renderNew() {
    const first = !sortedHouses().length;
    const preview = { ...form, manual: { state: 'open', until: roundUp30(now() + DEFAULT_OPEN) }, note: '', hours: [] };
    return `
      ${first ? `<div class="welcome">
        <h2>Let friends know when your door is open.</h2>
        <p>Open your door with one tap, add a note about what's going on, and see who else is around to hang out.</p>
      </div>` : `<div class="hello"><h2>Add a house</h2><p>Add a household you'd love to have stop by. You can switch to it any time from the top of the page.</p></div>`}
      <div class="panel-card">
        <div class="field"><label for="fname">${first ? 'Name your house' : 'House name'}</label>
          <input class="input" id="fname" value="${esc(form.name)}" placeholder="The Wolfe house" maxlength="40" autocomplete="off"></div>
        <div class="field"><label for="fmembers">Who lives there? <span class="hint">(optional)</span></label>
          <input class="input" id="fmembers" value="${esc(form.members)}" placeholder="Katrina, Sam + the baby" maxlength="60" autocomplete="off"></div>
        ${styleFields(form, 'f')}
        <div class="sec"><h2>Preview</h2><div id="fpreview">${cardHTML(preview, { preview: true })}</div></div>
        <p class="error" id="ferror" hidden>Give the house a name first.</p>
        <button class="btn pop block" data-act="create">${first ? 'Create my house' : 'Add house'}</button>
        ${first ? '' : `<button class="btn ghost" data-act="cancel-new">Cancel</button>`}
      </div>`;
  }

  function renderMine() {
    const h = me();
    return `
      <div class="hello"><h2>My house</h2></div>
      <div id="myCard">${cardHTML(h)}</div>

      <div class="panel-card">
        <div class="sec">
          <h2>Note</h2>
          <p class="hint">Friends see this while your door is open.</p>
          <div class="field">
            <textarea class="input" id="note" maxlength="140" placeholder="We made ice cream. Come get a scoop!" aria-label="Note for friends">${esc(h.note)}</textarea>
            <span class="counter tabular" id="noteCount">${(h.note || '').length}/140</span>
          </div>
          <div class="chips">${IDEAS.map((x, i) => `<button class="chip" data-act="idea" data-i="${i}">${esc(x)}</button>`).join('')}</div>
        </div>
        <div class="field"><label for="where">Which door?</label>
          <input class="input" id="where" value="${esc(h.where)}" placeholder="Backyard, come through the side gate" maxlength="60"></div>
        <p class="hint">Changes save as you type.</p>
      </div>

      <details class="settings" id="settingsBox" ${settingsOpen ? 'open' : ''}>
        <summary>House name, picture & card style</summary>
        <div class="settings-body">
          <div class="panel-card">
            <div class="field"><label for="hname">House name</label><input class="input" id="hname" value="${esc(h.name)}" maxlength="40"></div>
            <div class="field"><label for="hmembers">Who lives here</label><input class="input" id="hmembers" value="${esc(h.members)}" maxlength="60"></div>
            ${styleFields(h, 'm')}
          </div>
          <div class="panel-card">
            ${confirmDelete
              ? `<p class="hint">Remove ${esc(h.name)}? This deletes the house for everyone.</p><div class="actions"><button class="btn danger-solid" data-act="delete-yes">Remove house</button><button class="btn ghost" data-act="delete-no">Keep it</button></div>`
              : `<button class="btn danger" data-act="delete">Remove this house</button>`}
          </div>
        </div>
      </details>`;
  }

  function renderHours() {
    const h = me();
    return `
      <div class="hello">
        <h2>Open hours</h2>
        <p>Regular times anyone can drop by, even unannounced. Your door opens by itself during these.</p>
      </div>
      <div class="panel-card">
        ${(h.hours || []).length ? '' : '<p class="empty">No open hours yet.</p>'}
        ${(h.hours || []).map(w => `<div class="hrow">
          <div class="hrow-top"><span>${esc(fmtDays(w.days))} ${esc(fmtRange(w.start, w.end))}</span><button class="btn ghost" data-act="hours-del" data-w="${w.id}" aria-label="Remove these open hours">Remove</button></div>
          <div class="days">${DAY_INITIAL.map((d, i) => `<button class="day" data-act="hours-day" data-w="${w.id}" data-d="${i}" aria-pressed="${w.days.includes(i)}" aria-label="${DAYS[i]}">${d}</button>`).join('')}</div>
          <div class="times"><input type="time" id="hs-${w.id}" data-hours="start" data-w="${w.id}" value="${w.start}" aria-label="Start time"> to <input type="time" id="he-${w.id}" data-hours="end" data-w="${w.id}" value="${w.end}" aria-label="End time"></div>
        </div>`).join('')}
        <button class="btn" data-act="hours-add">+ Add open hours</button>
        <div class="field"><label for="hoursNote">Note during open hours</label>
          <input class="input" id="hoursNote" value="${esc(h.hoursNote)}" placeholder="Usually out front with coffee" maxlength="140"></div>
      </div>`;
  }

  function renderHeader() {
    const list = sortedHouses();
    $('#who').hidden = !list.length || !!form;
    $('#whoami').innerHTML = list.map(h => `<option value="${h.id}" ${h.id === currentId ? 'selected' : ''}>${esc(h.emoji)} ${esc(h.name)}</option>`).join('')
      + `<option value="__new">＋ New house</option>`;
  }
  function renderTabs() {
    const show = !!me() && !form;
    $('#tabs').hidden = !show;
    if (!show) return;
    const t = now();
    const lit = Object.values(houses).filter(h => h.id !== currentId && effective(h, t).state === 'open').length;
    const tabs = [['board', '🚪', "Who's open", lit], ['mine', '🏡', 'My house', 0], ['hours', '🗓', 'Open hours', 0]];
    $('#tabs').innerHTML = tabs.map(([k, i, l, c]) => `<button role="tab" aria-selected="${tab === k}" data-act="tab" data-tab="${k}"><span class="ico" aria-hidden="true">${i}</span>${l}${c ? `<span class="count">${c}</span>` : ''}</button>`).join('');
  }
  function render() {
    if (!loaded) {
      $('#view').innerHTML = `<div class="loading"><span class="lamp open" aria-hidden="true"></span><span>${esc(slowNote || 'Opening the door…')}</span></div>`;
      return;
    }
    if (!sortedHouses().length && !form) form = blankForm();
    renderHeader(); renderTabs();
    $('#view').innerHTML = form ? renderNew() : tab === 'mine' ? renderMine() : tab === 'hours' ? renderHours() : renderBoard();
  }
  function refreshMyCard() {
    const p = $('#myCard'); if (p && me()) p.innerHTML = cardHTML(me());
    const c = $('#noteCount'); if (c && me()) c.textContent = `${(me().note || '').length}/140`;
  }
  function refreshFormPreview() {
    const p = $('#fpreview'); if (!p || !form) return;
    p.innerHTML = cardHTML({ ...form, manual: { state: 'open', until: roundUp30(now() + DEFAULT_OPEN) }, note: '', hours: [] }, { preview: true });
  }
  const blankForm = () => ({ id: 'preview', name: '', members: '', emoji: pick(EMOJIS.slice(0, 8)), color: pick(COLORS).k, pattern: pick(PATTERNS).k });

  // ---- Events ----
  document.addEventListener('click', ev => {
    const b = ev.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, id = b.dataset.id, m = me();
    const h = id && byId(id);
    switch (act) {
      case 'tab': tab = b.dataset.tab; confirmDelete = false; window.scrollTo({ top: 0 }); break;
      case 'new': form = blankForm(); window.scrollTo({ top: 0 }); break;
      case 'cancel-new': form = null; break;
      case 'f-emoji': form.emoji = b.dataset.k; break;
      case 'f-color': form.color = b.dataset.k; break;
      case 'f-pattern': form.pattern = b.dataset.k; break;
      case 'create': {
        const name = form.name.trim();
        if (!name) { $('#ferror').hidden = false; $('#fname').focus(); return; }
        const first = !sortedHouses().length;
        const house = { id: newId('h'), name, members: form.members.trim(), emoji: form.emoji, color: form.color, pattern: form.pattern,
          manual: null, note: '', where: '', hoursNote: '', hours: [], watching: [], createdAt: now() };
        putHouse(house);
        form = null; tab = 'board';
        if (first || !m) { setCurrent(house.id); toast('🏡 Your house is ready!'); }
        else toast(`Added ${name}. Switch to ${verb(name, 'it', 'them')} from the top any time.`);
        prevStates[house.id] = 'closed';
        break;
      }
      case 'open': openDoor(m); toast(`🚪 Your door is open until ${fmtTime(m.manual.until)}`); break;
      case 'close': closeDoor(m); toast('Door closed'); break;
      case 'textfirst':
        m.manual.state = m.manual.state === 'text' ? 'open' : 'text';
        putHouse(m);
        toast(m.manual.state === 'text' ? '💬 Friends will text you first' : '🚪 Back to come on by');
        break;
      case 'come': {
        const v = { id: `${h.id}__${currentId}`, host: h.id, guest: currentId, at: now() };
        putVisit(v); seenVisits.add(v.id + v.at);
        toast(`👋 Told ${h.name} you're coming`);
        break;
      }
      case 'uncome': dropVisit(`${h.id}__${currentId}`); toast(`Let ${h.name} know you're not coming after all`); break;
      case 'bell': {
        const w = new Set(m.watching || []);
        if (w.has(id)) w.delete(id); else w.add(id);
        m.watching = [...w]; putHouse(m);
        toast(w.has(id) ? `🔔 You'll get a ping when ${h.name} ${verb(h.name, 'opens', 'open')} up` : `🔕 No more pings for ${h.name}`);
        break;
      }
      case 'idea': m.note = IDEAS[Number(b.dataset.i)]; putHouse(m); break;
      case 'm-emoji': m.emoji = b.dataset.k; putHouse(m); break;
      case 'm-color': m.color = b.dataset.k; putHouse(m); break;
      case 'm-pattern': m.pattern = b.dataset.k; putHouse(m); break;
      case 'delete': confirmDelete = true; break;
      case 'delete-no': confirmDelete = false; break;
      case 'delete-yes': {
        const name = m.name;
        dropHouse(m.id); confirmDelete = false; tab = 'board';
        setCurrent(null); ensureCurrent();
        toast(`Removed ${name}`);
        break;
      }
      case 'hours-day': {
        const w = m.hours.find(x => x.id === b.dataset.w), d = Number(b.dataset.d);
        w.days = w.days.includes(d) ? w.days.filter(x => x !== d) : [...w.days, d];
        putHouse(m);
        break;
      }
      case 'hours-add': m.hours = [...(m.hours || []), { id: newId('w'), days: [6], start: '15:00', end: '17:00' }]; putHouse(m); break;
      case 'hours-del': m.hours = m.hours.filter(x => x.id !== b.dataset.w); putHouse(m); break;
      default: return;
    }
    render();
  });

  document.addEventListener('input', ev => {
    const el = ev.target, m = me();
    if (form && el.id === 'fname') { form.name = el.value; $('#ferror').hidden = true; refreshFormPreview(); return; }
    if (form && el.id === 'fmembers') { form.members = el.value; refreshFormPreview(); return; }
    if (!m) return;
    if (el.id === 'note') { m.note = el.value; saveSoon(m); refreshMyCard(); }
    else if (el.id === 'where') { m.where = el.value; saveSoon(m); }
    else if (el.id === 'hoursNote') { m.hoursNote = el.value; saveSoon(m); }
    else if (el.id === 'hname') { m.name = el.value; saveSoon(m); refreshMyCard(); renderHeader(); }
    else if (el.id === 'hmembers') { m.members = el.value; saveSoon(m); refreshMyCard(); }
  });
  // Tapping into the note selects it, so you can type right over it or leave it as is
  document.addEventListener('focusin', ev => {
    const el = ev.target;
    if (el.id !== 'note') return;
    setTimeout(() => { try { el.setSelectionRange(0, el.value.length); } catch (e) { el.select(); } }, 0);
  });
  document.addEventListener('toggle', ev => { if (ev.target.id === 'settingsBox') settingsOpen = ev.target.open; }, true);
  document.addEventListener('change', ev => {
    const el = ev.target, m = me();
    if (el.id === 'whoami') {
      if (el.value === '__new') { form = blankForm(); el.blur(); render(); return; }
      setCurrent(el.value); tab = 'board'; confirmDelete = false;
      liveCheck(true); el.blur(); render();
      toast(`You're now ${me().name}`);
      return;
    }
    if (el.id === 'endSel') { m.manual.until = Number(el.value); putHouse(m); toast(`Open until ${fmtWhen(m.manual.until)}`); el.blur(); render(); return; }
    if (el.dataset.hours && el.value) {
      const w = m.hours.find(x => x.id === el.dataset.w);
      w[el.dataset.hours] = el.value;
      putHouse(m); el.blur(); render();
    }
  });

  // Statuses end and open hours begin on their own, so check the clock now and then
  setInterval(() => { if (loaded) { liveCheck(false); scheduleRender(); } }, 30000);

  connect();
})();
</script>
